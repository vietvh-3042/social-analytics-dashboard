spring.application.name=social-analytics-dashboard
server.port=${APP_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/social_analytics}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:social_analytics}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me-local}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.artemis.broker-url=${SPRING_ARTEMIS_BROKER_URL:tcp://localhost:61616}
spring.artemis.user=${SPRING_ARTEMIS_USER:artemis}
spring.artemis.password=${SPRING_ARTEMIS_PASSWORD:change-me-artemis}
spring.jms.listener.concurrency=1
spring.jms.listener.max-concurrency=3
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
spring.webservices.path=/ws
spring.webservices.servlet.load-on-startup=1
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:change-me-admin}
app.metrics.schedule=${APP_METRICS_SCHEDULE:0 0 * * * *}
app.web.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:8080}
logging.level.com.learning.social_analytics_dashboard=INFO
