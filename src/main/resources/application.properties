spring.application.name=social-analytics
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/social_analytics}
spring.datasource.username=${DATABASE_USERNAME:social_analytics}
spring.datasource.password=${DATABASE_PASSWORD:social_analytics}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_BROKER_URL:tcp://localhost:61616}
spring.artemis.user=${ARTEMIS_USERNAME:social_analytics}
spring.artemis.password=${ARTEMIS_PASSWORD:social_analytics}

spring.security.oauth2.client.registration.facebook.provider=facebook
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:local-facebook-client}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:local-facebook-secret}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.cookie-secure=${COOKIE_SECURE:false}
app.cookie-domain=${COOKIE_DOMAIN:}
