services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: social_analytics
      POSTGRES_USER: ${DATABASE_USERNAME:-social_analytics}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-social_analytics}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - social-analytics-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-social_analytics} -d social_analytics"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-this-password}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - social-analytics-pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  artemis:
    image: apache/activemq-artemis:2.38.0-alpine
    environment:
      ARTEMIS_USER: ${ARTEMIS_USERNAME:-social_analytics}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-social_analytics}
      ANONYMOUS_LOGIN: "false"
    ports:
      - "127.0.0.1:61616:61616"
      - "127.0.0.1:8161:8161"
    volumes:
      - social-analytics-artemis:/var/lib/artemis-instance
    healthcheck:
      test: ["CMD-SHELL", "/var/lib/artemis-instance/bin/artemis check node --up --url tcp://localhost:61616 --user \"$${ARTEMIS_USER}\" --password \"$${ARTEMIS_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/social_analytics
      DATABASE_USERNAME: ${DATABASE_USERNAME:-social_analytics}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-social_analytics}
      ARTEMIS_BROKER_URL: tcp://artemis:61616
      ARTEMIS_USERNAME: ${ARTEMIS_USERNAME:-social_analytics}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-social_analytics}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-local-facebook-client}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-local-facebook-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      artemis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  social-analytics-postgres:
  social-analytics-artemis:
  social-analytics-pgadmin:
